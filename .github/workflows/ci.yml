name: Windows checks

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JavaScript dependencies
        shell: pwsh
        run: |
          pnpm.cmd install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/esbuild/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          exit $LASTEXITCODE
      - name: Install Office worker environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r workers/office/requirements.txt
          exit $LASTEXITCODE
      - name: Type check
        run: pnpm.cmd typecheck
      - name: Code formatting
        run: pnpm.cmd format:check
      - name: Runtime and executor tests
        run: pnpm.cmd test
      - name: Office tests
        run: .venv/Scripts/python.exe -m pytest workers/office/tests -q --basetemp=workers/office/.test-tmp
      - name: Build desktop application
        run: pnpm.cmd build
      - name: Browser and Electron checks
        run: pnpm.cmd test:ui
      - name: Upload diagnostic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: test-results/
          retention-days: 7
